name: Tickets checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps
      - name: Typecheck
        run: npm run lint
      - name: Test appointment workdays
        run: npm run test:workdays
      - name: Test supervisor closure
        run: npm run test:supervisor-close
      - name: Verify approval migration safety
        run: node scripts/apply-closure-approvals.js ${{ github.event.pull_request.base.sha }} --check
      - name: Build
        run: npm run build
