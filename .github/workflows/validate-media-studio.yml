name: Media Studio Validation

on:
  push:
    branches:
      - feat/media-studio-dashboard

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
