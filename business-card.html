<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Card</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .business-card {
            background: white;
            width: 100%;
            max-width: 350px;
            border-radius: 20px;
            padding: 30px 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 15px;
            border: 4px solid #667eea;
            padding: 3px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .name {
            font-size: 24px;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
        }

        .title {
            font-size: 14px;
            color: #667eea;
            font-weight: 600;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .contact-info {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 8px;
            transition: background 0.3s;
        }

        .contact-item:last-child {
            margin-bottom: 0;
        }

        .contact-item:hover {
            background: #e9ecef;
        }

        .contact-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 12px;
            color: white;
            font-size: 18px;
        }

        .contact-text {
            flex: 1;
            color: #333;
            font-size: 14px;
        }

        .contact-text strong {
            display: block;
            font-size: 14px;
            color: #333;
        }

        .contact-text span {
            font-size: 13px;
            color: #666;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .social-link {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #667eea;
            text-decoration: none;
            font-size: 20px;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .social-link:hover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            transform: translateY(-3px);
        }

        .qr-code {
            margin: 0 auto;
            border-radius: 12px;
            padding: 10px;
            background: white;
        }

        .qr-code img {
            display: block;
            width: 150px;
            height: 150px;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }

        @media (max-width: 400px) {
            .business-card {
                padding: 25px 20px;
            }

            .name {
                font-size: 22px;
            }

            .avatar {
                width: 110px;
                height: 110px;
            }
        }
    </style>
</head>
<body>
    <div class="business-card">
        <!-- Profile Picture -->
        <img src="https://i.pravatar.cc/300?img=11" alt="Profile Picture" class="avatar">

        <!-- Name and Title -->
        <div class="name">Alexander Chen</div>
        <div class="title">Senior Marketing Manager</div>

        <!-- Contact Information -->
        <div class="contact-info">
            <div class="contact-item">
                <div class="contact-icon">📧</div>
                <div class="contact-text">
                    <strong>Email</strong>
                    <span>alex.chen@company.com</span>
                </div>
            </div>

            <div class="contact-item">
                <div class="contact-icon">📱</div>
                <div class="contact-text">
                    <strong>Phone</strong>
                    <span>+1 (555) 123-4567</span>
                </div>
            </div>

            <div class="contact-item">
                <div class="contact-icon">📍</div>
                <div class="contact-text">
                    <strong>Location</strong>
                    <span>San Francisco, CA</span>
                </div>
            </div>

            <div class="contact-item">
                <div class="contact-icon">💼</div>
                <div class="contact-text">
                    <strong>Company</strong>
                    <span>TechVision Inc.</span>
                </div>
            </div>
        </div>

        <!-- Social Media Links -->
        <div class="social-links">
            <a href="https://linkedin.com" target="_blank" class="social-link" title="LinkedIn">
                🔗
            </a>
            <a href="https://twitter.com" target="_blank" class="social-link" title="Twitter">
                🐦
            </a>
            <a href="https://instagram.com" target="_blank" class="social-link" title="Instagram">
                📷
            </a>
            <a href="https://facebook.com" target="_blank" class="social-link" title="Facebook">
                📘
            </a>
        </div>

        <!-- QR Code -->
        <div class="qr-code">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=BusinessCard&color=667eea" alt="QR Code">
        </div>

        <!-- Footer -->
        <div class="footer">
            Scan QR Code to save contact info
        </div>
    </div>
</body>
</html>
