# Legacy hostname compatibility.
#
# The canonical Retal Tickets hostname is tickets.knot-sys.com. This exact-name
# server block intentionally owns retal.knot-sys.com so the generic Knot
# wildcard vhost cannot present the wrong certificate for the legacy hostname.
# The dedicated certificate is bootstrapped by the production deploy workflow.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name retal.knot-sys.com;

    ssl_certificate /etc/letsencrypt/live/retal.knot-sys.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/retal.knot-sys.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 308 https://tickets.knot-sys.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name retal.knot-sys.com;

    return 308 https://tickets.knot-sys.com$request_uri;
}
