<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تجربة NaraRouter API</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');

        body {
            font-family: 'Cairo', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen p-4 md:p-8 flex items-center justify-center">
    <div class="w-full max-w-3xl bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden">
        <!-- Header -->
        <div class="bg-blue-600 p-6 text-white text-center">
            <h1 class="text-2xl font-bold mb-2">تجربة تحليل التذاكر بالذكاء الاصطناعي</h1>
            <p class="text-blue-100 text-sm">استخدام NaraRouter API</p>
        </div>

        <div class="p-6 md:p-8 space-y-6">
            <!-- API Key -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">مفتاح API (API Key)</label>
                <input type="password" id="apiKey"
                    class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                    placeholder="sk-nara-xxxxxxxx...">
                <p class="text-xs text-gray-500 mt-1">يتم تخزين المفتاح في متصفحك فقط ولا يتم إرساله لأي جهة سوى المنصة.
                </p>
            </div>

            <!-- System Prompt -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">تعليمات الذكاء الاصطناعي (System
                    Prompt)</label>
                <textarea id="systemPrompt" rows="2"
                    class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">أنت مساعد ذكي لخدمة العملاء. قم بتحليل نص التذكرة التالي واستخرج المعلومات المهمة (مثل: رقم التذكرة إن وجد، المشكلة الرئيسية، درجة الخطورة، وتصنيف المشكلة).</textarea>
            </div>

            <!-- Ticket Text -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">نص التذكرة (للتجربة)</label>
                <textarea id="ticketText" rows="4"
                    class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                    placeholder="الرجاء كتابة أو لصق نص التذكرة هنا..."></textarea>
            </div>

            <!-- Submit Button -->
            <button id="submitBtn" onclick="testAPI()"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-4 rounded-lg transition-all shadow-md hover:shadow-lg flex justify-center items-center gap-2">
                <span>إرسال وتحليل</span>
                <div id="loader"
                    class="hidden w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
            </button>

            <!-- Result -->
            <div class="mt-8 border-t border-gray-100 pt-6">
                <label class="block text-sm font-semibold text-gray-700 mb-2">نتيجة التحليل</label>
                <div id="resultBox"
                    class="w-full min-h-[120px] border border-gray-200 bg-gray-50 rounded-lg p-4 text-gray-800 whitespace-pre-wrap leading-relaxed shadow-inner">
                    لم يتم إرسال طلب بعد...</div>
            </div>
        </div>
    </div>

    <script>
        async function testAPI() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const ticketText = document.getElementById('ticketText').value.trim();
            const systemPrompt = document.getElementById('systemPrompt').value.trim();
            const resultBox = document.getElementById('resultBox');
            const submitBtn = document.getElementById('submitBtn');
            const loader = document.getElementById('loader');

            if (!apiKey) {
                alert('الرجاء إدخال مفتاح الـ API');
                return;
            }
            if (!ticketText) {
                alert('الرجاء إدخال نص التذكرة');
                return;
            }

            // UI Loading state
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-80', 'cursor-not-allowed');
            loader.classList.remove('hidden');
            resultBox.innerHTML = '<span class="text-gray-500">جاري تحليل التذكرة، يرجى الانتظار...</span>';
            resultBox.classList.remove('text-red-600', 'bg-red-50', 'border-red-200');

            try {
                const response = await fetch("https://router.bynara.id/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "tencent-hy3",
                        messages: [
                            { role: "system", content: systemPrompt },
                            { role: "user", content: ticketText }
                        ]
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error?.message || `حدث خطأ في الاتصال بالكود السري: ${response.status}`);
                }

                resultBox.textContent = data.choices[0].message.content;
            } catch (error) {
                console.error(error);
                resultBox.textContent = `خطأ:\n${error.message}`;
                resultBox.classList.add('text-red-600', 'bg-red-50', 'border-red-200');
            } finally {
                // UI Reset state
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-80', 'cursor-not-allowed');
                loader.classList.add('hidden');
            }
        }
    </script>
</body>

</html>
